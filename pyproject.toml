[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "url-extractor"
version = "0.1.0"
description = "Async URL-based company extraction with layered heuristics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "pydantic>=2.6.0",
]

[project.scripts]
url-extractor = "url_extractor.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["url_extractor*"]
