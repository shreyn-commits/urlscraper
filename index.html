<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DFM AI Table</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="table-shell">
        <div class="table-topbar">
          <div class="status-cluster">
            <img class="brand-mark" src="/assets/dfm-logo.png" alt="DFM logo" />
            <span id="status">Ready.</span>
          </div>
          <span id="sheetMeta"></span>
        </div>

        <div class="actionbar">
          <div class="action-group">
            <label class="upload-chip">
              <input id="csvFile" type="file" accept=".csv,text/csv" />
              <span>Import CSV</span>
            </label>
            <button id="addRowBtn" type="button">Add Row</button>
            <button id="addColBtn" type="button">Add Column</button>
            <button id="addAiColumnBtn" type="button" class="accent-btn">Add AI Column</button>
            <button id="runAiBtn" type="button">Run Selected Rows</button>
            <button id="runSelectedRowBtn" type="button">Run Current Row</button>
            <button id="exportBtn" type="button">Export CSV</button>
          </div>
          <div class="action-group muted-group">
            <button id="deleteRowBtn" type="button">Delete Row</button>
            <button id="deleteColBtn" type="button">Delete Column</button>
            <button id="newSheetBtn" type="button">New Sheet</button>
            <button id="renameSheetBtn" type="button">Rename Sheet</button>
            <span class="selection-summary" id="selectionSummary">A1 selected</span>
          </div>
        </div>

        <div class="formula-strip">
          <div class="cell-name" id="activeCellName">A1</div>
          <input id="formulaInput" type="text" placeholder="Edit cell value or formula" />
        </div>

        <div class="table-wrap">
          <table id="sheet"></table>
        </div>

        <div class="sheet-footer">
          <div class="sheet-tabs" id="sheetTabs"></div>
        </div>
      </section>
    </main>

    <div class="modal-backdrop hidden" id="aiColumnModal">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="aiColumnModalTitle">
        <div class="modal-header">
          <div>
            <p class="modal-eyebrow">DFM AI Column</p>
            <h2 id="aiColumnModalTitle">Create AI Column</h2>
            <p class="modal-copy">
              Set up a Clay-style enrichment column now, then run it row by row or across selected rows later.
            </p>
          </div>
          <button id="closeAiModalBtn" type="button" class="ghost-btn">Close</button>
        </div>

        <div class="modal-grid">
          <label class="field">
            <span>Column Name</span>
            <input id="aiColumnName" placeholder="For example: Cnf" />
          </label>

          <label class="field">
            <span>Provider</span>
            <select id="provider">
              <option value="openai">OpenAI</option>
              <option value="claude">Claude</option>
            </select>
          </label>

          <label class="field grow">
            <span>API Key</span>
            <input id="apiKey" type="password" placeholder="Used only in this browser session unless you set server env vars" />
          </label>

          <label class="field grow">
            <span>Model</span>
            <div class="inline-field">
              <select id="modelSelect">
                <option value="">Enter an API key to load models</option>
              </select>
              <button id="refreshModelsBtn" type="button">Load Models</button>
            </div>
            <p class="field-help" id="modelHelp">
              The model list is filtered to a curated set of supported models that your key can access.
            </p>
          </label>

          <label class="field grow">
            <span>Prompt</span>
            <div class="textarea-shell">
              <textarea
                id="prompt"
                rows="7"
                placeholder="Write the enrichment prompt for this column. Type / to pull in values from the current row."
              ></textarea>
              <div id="promptSlashMenu" class="slash-menu hidden"></div>
            </div>
            <p class="field-help">
              Use `/` to insert row-aware references like firstName, companyName, or any other available column.
            </p>
          </label>

          <label class="field grow">
            <span>Run Condition</span>
            <div class="textarea-shell">
              <textarea
                id="conditionPrompt"
                rows="4"
                placeholder="Optional. Example: only run if {{column:A}} mentions a real company and {{column:C}} is blank."
              ></textarea>
              <div id="conditionSlashMenu" class="slash-menu hidden"></div>
            </div>
            <p class="field-help">
              Return behavior is Clay-style: each row can be skipped unless the condition passes.
            </p>
          </label>
        </div>

        <div class="modal-actions">
          <button id="cancelAiModalBtn" type="button" class="ghost-btn">Cancel</button>
          <button id="saveAiColumnBtn" type="button" class="primary-btn">Save AI Column</button>
        </div>
      </div>
    </div>

    <div class="modal-backdrop hidden" id="jsonViewerModal">
      <div class="modal-card json-viewer" role="dialog" aria-modal="true" aria-labelledby="jsonViewerTitle">
        <div class="modal-header">
          <div>
            <p class="modal-eyebrow">AI Result</p>
            <h2 id="jsonViewerTitle">JSON Output</h2>
            <p class="modal-copy">
              This is the raw model response. Fields from this object are split into separate columns automatically.
            </p>
          </div>
          <button id="closeJsonViewerBtn" type="button" class="ghost-btn">Close</button>
        </div>

        <pre id="jsonViewerBody" class="json-viewer-body"></pre>

        <div class="modal-actions">
          <button id="copyJsonBtn" type="button" class="ghost-btn">Copy JSON</button>
        </div>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
